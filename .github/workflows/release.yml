name: Release plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches info.toml
        shell: pwsh
        run: |
          $info = Get-Content ./info.toml -Raw
          $version = [regex]::Match($info, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match info.toml version v$version"
          }

      - name: Build .op package
        shell: pwsh
        run: ./build.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/RecordsPlusPlus-*.op
